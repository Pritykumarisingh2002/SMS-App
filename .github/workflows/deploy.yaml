name: SMS CI/CD

on:
  push:
    branches:
      - Main   # Change to Main only if your branch is actually named Main

jobs:
  build:
    name: Build Expo APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Latest EAS CLI
        run: npm install -g eas-cli@latest

      - name: Check EAS Version
        run: eas --version

      - name: Verify Expo Login
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}