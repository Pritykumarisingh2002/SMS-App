name: SMS CI/CD

on:
  push:
    branches:
      - Main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Success
        run: echo "Workflow is working!"