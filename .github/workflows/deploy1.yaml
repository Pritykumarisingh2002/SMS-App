name: SMS CI/CD

on:
  push:
    branches:
      - Main   

jobs:
  build:
    name: Build Expo APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Latest EAS CLI
        run: npm install -g eas-cli@latest

      - name: Check EAS Version
        run: eas --version

      - name: Verify Expo Login
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # Continuous Deployment (CD) Job
  deploy:
    name: Deploy to Ubuntu Server
    runs-on: self-hosted 
    needs: build 
    
    steps:
      - name: Deploy changes via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}         # Fixed: Clean variable name
          username: ${{ secrets.SERVER_USERNAME }} # Fixed: Clean variable name
          key: ${{ secrets.SSH_PRIVATE_KEY }}     # Fixed: Clean variable name
          port: 22 
          script: |
            # Navigate to your project folder on the Ubuntu server
            cd /var/www/html/SMS
            
            # Pull the latest changes directly from your GitHub repository
            git pull origin main
